moveit_simple_controller_manager:
  controller_names:
    - arm_controller
    - gripper_controller

arm_controller:
  type: FollowJointTrajectory
  joints:
    - base_yaw
    - shoulder_roll
    - shoulder_pitch
    - elbow_pitch

gripper_controller:
  type: FollowJointTrajectory
  joints:
    - finger_1_joint
    - finger_2_joint
    - finger_3_joint
